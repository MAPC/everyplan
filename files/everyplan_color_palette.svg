  <text class="section" x="20" y="162">Accent palette</text>
  <rect x="20" y="172" width="120" height="60" rx="6" fill="#D85A30"/>
  <text class="label" x="80" y="196" text-anchor="middle">Coral</text>
  <text class="hex" x="80" y="214" text-anchor="middle">#D85A30</text>

  <rect x="150" y="172" width="120" height="60" rx="6" fill="#BA7517"/>
  <text class="label" x="210" y="196" text-anchor="middle">Amber</text>
  <text class="hex" x="210" y="214" text-anchor="middle">#BA7517</text>

  <rect x="280" y="172" width="120" height="60" rx="6" fill="#534AB7"/>
  <text class="label" x="340" y="196" text-anchor="middle">Purple</text>
  <text class="hex" x="340" y="214" text-anchor="middle">#534AB7</text>

  <!-- Neutrals -->
  <text class="section" x="450" y="162">Neutrals</text>
  <rect x="450" y="172" width="90" height="60" rx="6" fill="#333333"/>
  <text class="label" x="495" y="196" text-anchor="middle">Text</text>
  <text class="hex" x="495" y="214" text-anchor="middle">#333333</text>

  <rect x="550" y="172" width="90" height="60" rx="6" fill="#F7F9FC" stroke="#ddd" stroke-width="0.5"/>
