<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 500; fill: #333; }
    .label { font-size: 11px; font-weight: 500; fill: #fff; }
    .hex { font-size: 9px; fill: rgba(255,255,255,0.8); }
    .section { font-size: 13px; font-weight: 500; fill: #555; }
    .desc { font-size: 10px; fill: #888; }
    .tag-text { font-size: 10px; }
  </style>

  <text class="title" x="20" y="28">EveryPlan Design System — Color Reference</text>

  <!-- Primary palette -->
  <text class="section" x="20" y="62">Primary palette</text>
  <rect x="20" y="72" width="120" height="60" rx="6" fill="#1B4F72"/>
  <text class="label" x="80" y="96" text-anchor="middle">Navy</text>
  <text class="hex" x="80" y="114" text-anchor="middle">#1B4F72</text>

  <rect x="150" y="72" width="120" height="60" rx="6" fill="#2E75B6"/>
  <text class="label" x="210" y="96" text-anchor="middle">Blue</text>
  <text class="hex" x="210" y="114" text-anchor="middle">#2E75B6</text>

  <rect x="280" y="72" width="120" height="60" rx="6" fill="#1B6B52"/>
  <text class="label" x="340" y="96" text-anchor="middle">Forest</text>
  <text class="hex" x="340" y="114" text-anchor="middle">#1B6B52</text>

  <rect x="410" y="72" width="120" height="60" rx="6" fill="#2E9E78"/>
  <text class="label" x="470" y="96" text-anchor="middle">Teal</text>
  <text class="hex" x="470" y="114" text-anchor="middle">#2E9E78</text>

  <rect x="540" y="72" width="120" height="60" rx="6" fill="#43C99B"/>
  <text class="label" x="600" y="96" text-anchor="middle" fill="#04342C">Mint</text>
  <text class="hex" x="600" y="114" text-anchor="middle" fill="#085041">#43C99B</text>

