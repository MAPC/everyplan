  <text class="hex" x="595" y="214" text-anchor="middle" fill="#666">#F7F9FC</text>

  <rect x="650" y="172" width="90" height="60" rx="6" fill="#555555"/>
  <text class="label" x="695" y="196" text-anchor="middle">Secondary</text>
  <text class="hex" x="695" y="214" text-anchor="middle">#555555</text>

