  <text class="tag-text" x="236" y="372" text-anchor="middle" fill="#185FA5">Climate</text>

  <text class="desc" x="20" y="404">Amber — operations and funding</text>
  <rect x="20" y="412" width="80" height="24" rx="12" fill="#FAEEDA"/>
  <text class="tag-text" x="60" y="428" text-anchor="middle" fill="#854F0B">Funding</text>
  <rect x="108" y="412" width="100" height="24" rx="12" fill="#FAEEDA"/>
